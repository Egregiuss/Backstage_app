name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  SERVICE: backstage
  IMAGE: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/backstage/backstage

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/822209423456/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: backstage-deployer@project-50816be8-7e90-4d83-95c.iam.gserviceaccount.com

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build:all
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          BACKEND_BASE_URL: ${{ secrets.BACKEND_BASE_URL }}

      - name: Build Docker image
        run: docker build -f packages/backend/Dockerfile -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .

      - name: Push Docker image
        run: |
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE \
            --image $IMAGE:${{ github.sha }} \
            --region $REGION \
            --platform managed \
            --port 7007 \
            --set-env-vars APP_BASE_URL=${{ secrets.APP_BASE_URL }},BACKEND_BASE_URL=${{ secrets.BACKEND_BASE_URL }},GITHUB_TOKEN=${{ secrets.BACKSTAGE_TOKEN }} \
            --allow-unauthenticated \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 1
