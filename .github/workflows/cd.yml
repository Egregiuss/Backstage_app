name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GKE_CLUSTER: ${{ secrets.GKE_CLUSTER }}
  GKE_ZONE: ${{ secrets.GKE_ZONE }}
  IMAGE: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/backstage/backstage

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/822209423456/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: backstage-deployer@project-50816be8-7e90-4d83-95c.iam.gserviceaccount.com

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build backend
        run: yarn build:backend

      - name: Build Docker image
        run: docker build -f packages/backend/Dockerfile -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .

      - name: Push Docker image
        run: |
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ secrets.GKE_CLUSTER }}
          location: ${{ secrets.GKE_ZONE }}

      - name: Create namespace
        run: kubectl create namespace backstage --dry-run=client -o yaml | kubectl apply -f -

      - name: Create Kubernetes secrets
        run: |
          kubectl create secret generic backstage-secrets \
            --namespace=backstage \
            --from-literal=APP_BASE_URL=${{ secrets.APP_BASE_URL }} \
            --from-literal=BACKEND_BASE_URL=${{ secrets.BACKEND_BASE_URL }} \
            --from-literal=GITHUB_TOKEN=${{ secrets.BACKSTAGE_TOKEN }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Update image in deployment
        run: |
          sed -i "s|us-central1-docker.pkg.dev/PROJECT_ID/backstage/backstage:latest|$IMAGE:${{ github.sha }}|g" k8s/deployment.yaml

      - name: Deploy to GKE
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl rollout status deployment/backstage -n backstage
