name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Write SSH key
        shell: bash
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$RUNNER_TEMP/ssh/vm_key"
          chmod 600 "$RUNNER_TEMP/ssh/vm_key"

      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key_path: ${{ runner.temp }}/ssh/vm_key
          port: 22
          script: |
            cd ~/Backstage_app

            git fetch origin main
            git reset --hard origin/main

            yarn install --immutable

            pm2 delete backstage || true

            export HOST=0.0.0.0
            export APP_CONFIG_app_baseUrl='${{ secrets.APP_BASE_URL }}'
            export APP_CONFIG_backend_baseUrl='${{ secrets.BACKEND_BASE_URL }}'

            pm2 start "yarn start" --name backstage --time
            pm2 save