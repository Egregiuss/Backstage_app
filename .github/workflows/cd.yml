
name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Write SSH key
        shell: bash
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$RUNNER_TEMP/ssh/vm_key"
          chmod 600 "$RUNNER_TEMP/ssh/vm_key"

      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key_path: ${{ runner.temp }}/ssh/vm_key
          port: 22
          script: |

            echo "Starting deployment..."

            cd ~/Backstage_app

            echo "Updating repo..."
            git fetch origin main
            git reset --hard origin/main

            echo "Installing dependencies..."
            yarn install --immutable

            echo "Cleaning old processes..."
            pm2 delete all || true
            pkill -f "yarn dev" || true
            pkill -f "yarn start" || true

            echo "Starting Backstage..."

            HOST=0.0.0.0 \
            APP_BASE_URL='${{ secrets.APP_BASE_URL }}' \
            BACKEND_BASE_URL='${{ secrets.BACKEND_BASE_URL }}' \
            pm2 start "yarn dev" --name backstage --update-env

            pm2 save

            echo "Deployment complete!"

