name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Write SSH key
        shell: bash
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$RUNNER_TEMP/ssh/vm_key"
          chmod 600 "$RUNNER_TEMP/ssh/vm_key"

      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key_path: ${{ runner.temp }}/ssh/vm_key
          port: 22
          script: |
            cd ~/Backstage_app

            # 1️⃣ Pull latest code
            git fetch origin main
            git reset --hard origin/main

            # 2️⃣ Install dependencies
            yarn install --immutable

            # 3️⃣ Build the frontend
            yarn workspace app build

            # 4️⃣ Stop any existing PM2 process
            pm2 delete backstage || true

            # 5️⃣ Start the backend (serves frontend as well)
            pm2 start --name backstage -- bash -lc "\
              HOST=0.0.0.0 \
              APP_BASE_URL=${APP_BASE_URL} \
              BACKEND_BASE_URL=${BACKEND_BASE_URL} \
              yarn workspace backend start"

            # 6️⃣ Save PM2 process list
            pm2 save --force
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          BACKEND_BASE_URL: ${{ secrets.BACKEND_BASE_URL }}